# hyprlock — lock screen generated by matugen from the current wallpaper palette.
#
# Same palette as Waybar, rofi and dunst; edit the template in
# ~/.config/matugen/templates/, not this file. The background is the live
# screen, so it always matches the wallpaper without an extra image copy.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.72
    dim_inactive = false
}

input-field {
    monitor =
    size = 280, 46
    rounding = 12
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.18
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface_container.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    check_color = rgb({{colors.tertiary.default.hex_stripped}})
    capslock_color = rgb({{colors.error.default.hex_stripped}})
    placeholder_text = Password
    fail_text = Wrong password
    fade_on_empty = false
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 72
    font_family = Inter Bold
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 16
    font_family = Inter
    position = 0, 62
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 14
    font_family = Inter
    position = 0, -58
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgb({{colors.primary.default.hex_stripped}})
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -84
    halign = center
    valign = center
}
