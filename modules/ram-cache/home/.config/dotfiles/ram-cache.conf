# RAM cache settings. This file is sourced by ramcache (trusted user config).
# RAM_PERCENT is the maximum share of MemAvailable used for page-cache warming.
RAM_PERCENT=50
WAIT_SECONDS=20
# Extra directories to warm. One path per line, quoted.
CACHE_DIRS=(
)
# Browser profiles are handled by profile-sync-daemon, not by this script.
USE_PSD=1
