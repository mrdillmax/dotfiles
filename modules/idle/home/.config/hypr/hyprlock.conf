general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    dim_inactive = false
}

input-field {
    monitor =
    size = 240, 40
    outline_thickness = 2
    dots_size = 0.2
    outer_color = rgb(ffffff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = Inter
    position = 0, -40
    halign = center
    valign = center
}
