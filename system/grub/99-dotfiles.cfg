# GRUB settings for this repository.
#
# grub-mkconfig reads this after /etc/default/grub, so every value here wins.
# The kernel parameters suit the nvidia/hybrid profiles only; the installer
# copies this file just for those profiles.

GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu

# quiet keeps the console clean; loglevel=2 still shows real problems.
# nvidia_drm.modeset/fbdev are required for a flicker-free Wayland boot.
# nowatchdog avoids the watchdog overhead; psi enables pressure stall info.
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=2 nvidia_drm.modeset=1 nvidia_drm.fbdev=1 nowatchdog psi=1"
GRUB_CMDLINE_LINUX=""

GRUB_GFXMODE="1920x1080"
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_DISABLE_OS_PROBER=false
GRUB_DISABLE_MEMTEST=true
