# mkinitcpio — initramfs settings for this repository.
#
# mkinitcpio reads this after /etc/mkinitcpio.conf; arrays are replaced whole.
# The installer copies this file for the nvidia/hybrid profiles only.

# Early KMS needs the NVIDIA modules inside the image.
MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)

# systemd-based initramfs with btrfs root and sd-vconsole for the console keymap.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block btrfs filesystems fsck)
