# Unbound for Pi-hole.
#
# Drop-in for the stock /etc/unbound/unbound.conf. Pi-hole listens on port 53
# and forwards to this recursive resolver on 5335, so answers are cached twice
# and blocklists apply before a name ever reaches the network.
#
# Validate with: unbound-checkconf /etc/unbound/unbound.conf.d/pi-hole.conf

server:
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Pi-hole is the only client and it speaks IPv4 on loopback.
    do-ip6: no
    prefer-ip6: no

    # Root hints are refreshed by install.sh from internic.net.
    root-hints: "/etc/unbound/root.hints"

    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no

    # 1232 bytes avoids fragmentation on paths that drop large UDP replies.
    edns-buffer-size: 1232

    prefetch: yes
    num-threads: 1
    so-rcvbuf: 1m

    # Answers that point at private space must come from local data only.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
