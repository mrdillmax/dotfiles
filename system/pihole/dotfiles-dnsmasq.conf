# dnsmasq — extra settings for the Pi-hole + unbound chain.
#
# FTL reads this directory only when misc.etc_dnsmasq_d is true; install.sh
# sets that through pihole-FTL --config. Keep this file to settings that
# pihole.toml does not generate, so the two never disagree.

# RFC 6761 names stay local and never reach an upstream server.
server=/test/
server=/invalid/
server=/bind/
server=/onion/

# Private reverse lookups that Pi-hole does not know are NXDOMAIN, not leaks.
bogus-priv
