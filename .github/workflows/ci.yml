name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: shellcheck and tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install test tools
        run: pacman -Syu --noconfirm --needed bash shellcheck jq git

      - name: Lint shell scripts
        run: make lint

      - name: Run the test suite
        shell: bash
        run: |
          set -uo pipefail
          status=0
          shopt -s nullglob
          tests=(tests/*.sh)
          if ((${#tests[@]} == 0)); then
            printf 'no tests found\n' >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            printf '\n== %s ==\n' "$test"
            bash "$test" || status=1
          done
          exit "$status"

      - name: Read-only doctor snapshot
        if: always()
        run: ./install.sh --doctor || true
